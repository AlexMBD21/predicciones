<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='bg' cx='35%25' cy='30%25' r='65%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='65%25' stop-color='%23cbd5e1'/%3E%3Cstop offset='100%25' stop-color='%2364748b'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23bg)' stroke='%232ee59d' stroke-width='1.5'/%3E%3Cpolygon points='16,10 20.2,13.2 18.6,18.5 13.4,18.5 11.8,13.2' fill='%230b1329'/%3E%3Cpath d='M16 10 L16 1 M20.2 13.2 L29.5 9.5 M18.6 18.5 L26 27 M13.4 18.5 L6 27 M11.8 13.2 L2.5 9.5' stroke='%230b1329' stroke-width='1.2'/%3E%3C/svg%3E">
  <title>PronoBello · Pronósticos de fútbol con IA</title>
  <meta name="description" content="Pronósticos de fútbol con IA: probabilidades 1X2, goles esperados, forma, bajas, alineaciones y localía en tiempo real." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=20" />
  <link rel="stylesheet" href="/live.css?v=20" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo logo-animated" aria-label="Logo Balón">
        <svg class="ball-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="ballSphere" cx="35%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="60%" stop-color="#e2e8f0"/>
              <stop offset="100%" stop-color="#94a3b8"/>
            </radialGradient>
            <linearGradient id="patchDark" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0f172a"/>
              <stop offset="100%" stop-color="#1e293b"/>
            </linearGradient>
            <radialGradient id="ballShade" cx="50%" cy="50%" r="50%">
              <stop offset="80%" stop-color="transparent"/>
              <stop offset="100%" stop-color="rgba(15,23,42,0.45)"/>
            </radialGradient>
          </defs>
          <!-- Esfera del balón -->
          <circle cx="18" cy="18" r="16.5" fill="url(#ballSphere)" stroke="#2ee59d" stroke-width="1.2"/>
          <!-- Pentágono central -->
          <polygon points="18,11.5 22.8,15 21,20.8 15,20.8 13.2,15" fill="url(#patchDark)" stroke="#334155" stroke-width="0.8"/>
          <!-- Costuras principales -->
          <line x1="18" y1="11.5" x2="18" y2="1.5" stroke="#334155" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="22.8" y1="15" x2="33.5" y2="12" stroke="#334155" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="21" y1="20.8" x2="28" y2="30.5" stroke="#334155" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="15" y1="20.8" x2="8" y2="30.5" stroke="#334155" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="13.2" y1="15" x2="2.5" y2="12" stroke="#334155" stroke-width="1.1" stroke-linecap="round"/>
          <!-- Parches periféricos -->
          <path d="M14.5 1.8 C15.6 1.6 16.8 1.5 18 1.5 C19.2 1.5 20.4 1.6 21.5 1.8 L20 5 L16 5 Z" fill="url(#patchDark)"/>
          <path d="M31.5 8.5 C32.8 10.2 33.7 12 34.2 14 L30 15.5 L28 12 Z" fill="url(#patchDark)"/>
          <path d="M28 30.5 C26 32.2 23.5 33.5 21 34.2 L21.5 29.5 L25.5 27.5 Z" fill="url(#patchDark)"/>
          <path d="M8 30.5 C10 32.2 12.5 33.5 15 34.2 L14.5 29.5 L10.5 27.5 Z" fill="url(#patchDark)"/>
          <path d="M4.5 8.5 C3.2 10.2 2.3 12 1.8 14 L6 15.5 L8 12 Z" fill="url(#patchDark)"/>
          <!-- Sombra 3D periférica -->
          <circle cx="18" cy="18" r="16.5" fill="url(#ballShade)" pointer-events="none"/>
          <!-- Brillo especular superior -->
          <ellipse cx="12" cy="9" rx="5" ry="2.5" transform="rotate(-30 12 9)" fill="#ffffff" opacity="0.6"/>
          <circle cx="9.5" cy="7.5" r="1.2" fill="#ffffff" opacity="0.8"/>
        </svg>
      </span>
      <span>Prono<b>Bello</b></span>
    </div>
    <div class="search-wrap" id="searchWrap">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="teamSearch" class="search-input" placeholder="Buscar equipo o selección..." autocomplete="off" spellcheck="false" />
        <button type="button" id="clearSearch" class="search-clear" aria-label="Limpiar búsqueda" title="Limpiar" style="display:none;">✕</button>
        <kbd class="search-kbd" title="Presiona '/' para buscar">/</kbd>
      </div>
    </div>
    <div id="status" class="status-pill">Conectando…</div>
  </header>

  <main class="container">
 

    <nav id="dates" class="dates" aria-label="Fechas"></nav>
    <div id="statuses" class="chips" aria-label="Estado del partido"></div>
    <div id="leagues" class="chips" aria-label="Ligas"></div>
    <section id="matches" class="grid" aria-live="polite"></section>

    
  </main>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <aside class="drawer-panel" id="panel"></aside>
  </div>
  <script src="/app.js?v=20" type="module"></script>
</body>
</html>
