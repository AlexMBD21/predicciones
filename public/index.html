<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PronoXI · Pronósticos de fútbol con IA</title>
  <meta name="description" content="Pronósticos de fútbol con IA: probabilidades 1X2, goles esperados, forma, bajas, alineaciones y localía en tiempo real." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/live.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div><div class="bg-orb orb-2"></div>
  <header class="topbar">
    <div class="brand"><span class="logo">⚽</span><span>Prono<b>XI</b></span></div>
    <div id="status" class="status-pill">Conectando…</div>
  </header>

  <main class="container">
 

    <nav id="dates" class="dates" aria-label="Fechas"></nav>
    <div id="statuses" class="chips" aria-label="Estado del partido"></div>
    <div id="leagues" class="chips" aria-label="Ligas"></div>
    <section id="matches" class="grid" aria-live="polite"></section>

    <p class="disclaimer">⚠️ Son estimaciones probabilísticas, no certezas. Ningún modelo puede garantizar resultados. Juega con responsabilidad (+18).</p>
  </main>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <aside class="drawer-panel" id="panel"></aside>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
